<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/smart-azan-clock.css">
    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/vars.js"></script>
</head>

<body>
    <div id="appDiv">
        <div id="topCard" class="card bg-dark text-light mt-0 pt-0 text-center border-0">
            <div id="loading" style="display:none;">
                <div id="loadingInnerDiv">
                    <img id="loadingImg" src="images/check.png" />
                </div>
            </div>
            <div id="audioPlayerDiv" style="display:none;">
                <div class="d-flex flex-column justify-content-center align-items-center gap-3 h-100">
                    <div><audio id="audioPlayer"></audio></div>
                </div>
            </div>

            <div class="card-header p-1 m-0">

                <div class="d-flex flex-row justify-content-between align-items-center">

                    <div class="d-flex flex-row justify-content-center align-items-center menu-row">
                        <div id="menu-div-clock" class="menu-div bg-secondary pointerOn rounded">
                            <img class="menu-img menu-clock-img" />
                        </div>
                        <div id="menu-div-settings" class="menu-div menu-settings pointerOn rounded">
                            <img class="menu-img pointerOn" src="images/settings.svg" />
                        </div>
                        <div id="menu-div-adhans-offsets" class="menu-div menu-adhans-offsets rounded pointerOn">
                            <img id="offset-adjustments-blank" style="display:none;" class="menu-img offset-adjustments"
                                src="images/offset-adjustments-blank.svg" />
                            <img id="offset-adjustments-red" style="display:none;" class="menu-img offset-adjustments"
                                src="images/offset-adjustments-red.svg" />
                        </div>
                        <div id="menu-div-alarms" class="menu-div menu-alarms rounded pointerOn">
                            <img id="alarmMenuIcon" class="menu-img" src="images/alarm.svg" />
                        </div>
                        <div id="menu-div-calendar" class="menu-div menu-calendar pointerOn rounded">
                            <img class="menu-img" src="images/calendar.svg" />
                        </div>
                        <div id="menu-div-quran" class="menu-div menu-quran pointerOn rounded">
                            <svg class="menu-img quran-menu-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M12 7v14" />
                                <path
                                    d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
                            </svg>
                        </div>
                        <button id="quranHeaderToggle" type="button" class="quran-header-toggle"
                            aria-label="Play or pause Qur'an" title="Qur'an"><svg class="qicon qplay"
                                xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path
                                    d="M8 5v14l11-7z" /></svg><svg class="qicon qpause" xmlns="http://www.w3.org/2000/svg"
                                viewBox="0 0 24 24" fill="currentColor"><path
                                    d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg></button>
                    </div>

                    <div id="stopAdhanDiv" class="pointerOn rounded" style="background-color: #F20031; display:none;">
                        <img class="menu-img" src="images/pause.svg" />
                    </div>

                    <div class="d-flex flex-row align-items-center justify-content-end gap-1">
                        <div id="addressMenuText" class="menu-text badge bg-light text-dark menu-settings pointerOn">
                        </div>
                        <span class="adhansToggle pointerOn d-flex align-items-center"
                            title="Azan audio on / off — tap to change" style="line-height:1; padding-left:2px;">
                            <img class="adhan-on" src="images/audio-on.png" style="height:18px; display:none;" />
                            <img class="adhan-off" src="images/audio-off.png" style="height:18px; display:none;" />
                        </span>
                    </div>

                </div>

            </div>
            <div class="card-body py-0 px-3">

                <div id="times" class="tabDiv text-center">

                    <img class="align-center img-fluid mt-2" id="clock" />

                    <div class="d-flex flex-row justify-content-center align-items-center mt-1">
                        <div>
                            <div>
                                <span id="ntTitle" class="small"></span>
                            </div>
                            <div id="nextText" class="badge"></div>
                            <div class="mt-1">
                                <span id="elapsedText" class="badge bg-darkish"></span>
                                <span id="remainingForIftar" class="badge bg-success text-light"></span>
                            </div>
                        </div>

                    </div>

                </div>

                <div id="calendarTab" class="tabDiv text-center h-100" style="display:none;">

                    <div class="d-flex flex-column h-100" style="overflow:hidden;">

                        <div class="cal-nav d-flex flex-row align-items-center justify-content-between gap-1 flex-shrink-0">
                            <button id="calPrev" type="button" class="btn btn-darkish btn-sm cal-nav-btn"
                                aria-label="Previous month">‹</button>
                            <div id="calTitle" class="cal-title pointerOn flex-fill"></div>
                            <button id="calNext" type="button" class="btn btn-darkish btn-sm cal-nav-btn"
                                aria-label="Next month">›</button>
                        </div>

                        <div id="calWeekdays" class="cal-grid cal-weekdays flex-shrink-0"></div>

                        <div id="calDays" class="cal-grid cal-days flex-shrink-0"></div>

                        <div id="calUpcomingTitle" class="cal-upcoming-title flex-shrink-0"></div>

                        <div id="calUpcoming" class="cal-upcoming flex-grow-1 csb pe-1"></div>

                    </div>

                </div>

                <div id="basicSettings" class="tabDiv text-start" style="display:none">

                    <form id="addressForm">
                        <div class="badge mt-1 p-0" id="addressTitle"></div>
                        <div class="d-flex flex-row justify-content-between gap-1">
                            <div class="flex-fill"><input type="text" class="form-control form-control-sm"
                                    name="address" id="address" />
                            </div>
                            <div><button type="submit" id="addressButton" class="btn btn-primary btn-sm"><img
                                        src="images/right-arrow.png" /></button></div>
                            <div><button title="Google Maps" type="button" id="googleMapsButton"
                                    class="btn btn-secondary btn-sm"><img src="images/google-maps.png" /></button></div>
                        </div>
                    </form>

                    <div class="mt-1">
                        <div class="badge p-0" id="calculationMethodTitle"></div>
                        <select class="form-control form-control-sm" id="calculationMethod">
                        </select>
                    </div>

                    <div class="mt-1">
                        <span class="badge bg-darkish text-light" id="fajrAngle"></span>
                        <span class="badge bg-darkish text-light" id="ishaAngle"></span>
                    </div>

                    <div class="mt-1">
                        <div class="d-flex flex-row justify-content-between align-items-center">
                            <div class="badge px-0" id="iconTitle"></div>

                            <div id="lastHourHiliteOn" class="lastHourHilite badge pointerOn p-0" style="display:none;">
                                <img src="images/hiliteOn.png" title="Last hour highlight: ON" class="rounded" />
                            </div>
                            <div id="lastHourHiliteOff" class="lastHourHilite badge pointerOn p-0"
                                style="display:none;">
                                <img src="images/hiliteOff.png" title="Last hour highlight: OFF" class="rounded" />
                            </div>
                        </div>
                        <div class="btn-group btn-group-sm col-12" role="group">
                            <button id="badgeButton" type="button" value="badge" class="btn iconButton">
                                <img id="barImg" class="mt-1" />
                            </button>
                            <button id="clockButton" type="button" value="clock" class="btn iconButton">
                                <img id="iconImg" />
                            </button>
                        </div>
                    </div>

                    <div class="d-flex flex-row justify-content-between gap-1 mt-2">
                        <div class="adhansToggle bg-darkish rounded px-2 py-1 pointerOn flex-fill">
                            <span class="px-switch" id="adhanEnabledSwitch"></span>
                            <span class="badge px-1" id="enableAdhanCallsTitle"></span>
                            <img class="adhan-on" src="images/audio-on.png" style="height:19px; display: none;" />
                            <img class="adhan-off" src="images/audio-off.png" style="height:19px; display:none;" />
                        </div>
                        <div class="bg-darkish menu-adhans-offsets px-2 py-1 pointerOn">
                            <img class="adhan-on" src="images/mic.svg" style="height:19px; display: none;" />
                            <img class="adhan-off" src="images/mic-na.png" style="height:19px; display:none;" />
                        </div>
                    </div>

                    <div id="desktopNotificationsToggle" class="bg-darkish rounded px-2 py-1 mt-1 pointerOn flex-fill">
                        <span class="px-switch" id="desktopNotificationsSwitch"></span>
                        <span class="badge px-1" id="desktopNotificationsTitle"></span>
                    </div>

                    <div id="hanafiAsrToggle" class="bg-darkish rounded px-2 py-1 mt-1 pointerOn">
                        <span class="px-switch" id="hanafiAsrSwitch"></span>
                        <span class="badge px-1" id="hanafiAsrTitle"></span>
                    </div>

                    <div class="d-flex flex-row justify-content-between gap-1 mt-1">
                        <div id="showImsakToggle" class="bg-darkish rounded px-2 py-1 pointerOn flex-fill">
                            <span class="px-switch" id="showImsakSwitch"></span>
                            <span class="badge px-1" id="showImsakTitle"></span>
                        </div>
                        <div id="showDuhaToggle" class="bg-darkish rounded px-2 py-1 pointerOn flex-fill">
                            <span class="px-switch" id="showDuhaSwitch"></span>
                            <span class="badge px-1 duhaText"></span>
                        </div>

                    </div>

                    <div class="d-flex flex-row justify-content-between gap-1 mt-1">
                        <div id="showMidnightToggle" class="bg-darkish rounded px-2 py-1 pointerOn flex-fill">
                            <span class="px-switch" id="showMidnightSwitch"></span>
                            <span class="badge px-1" id="showMidnightTitle"></span>
                        </div>
                        <div id="hour24Toggle" class="bg-darkish rounded px-2 py-1 pointerOn flex-fill">
                            <span class="px-switch" id="hour24Switch"></span>
                            <span class="badge px-1" id="hour24Title"></span>
                        </div>
                    </div>
                </div>

                <div id="adhanOffsetSettings" class="tabDiv text-start h-100 pb-3" style="display:none;">

                    <div class="d-flex flex-column h-100 justify-content-between" style="overflow: hidden;">

                        <div id="adhanOffsetSettingsContent"></div>

                        <div>
                            <div class="badge p-0" id="audioVolumeTitle"></div>
                            <div id="audioVolumeDiv" class="bg-darkish rounded px-2 py-1">
                                <div class="d-flex flex-row align-items-center justify-content-start gap-2">
                                    <div class="flex-shrink-1">
                                        <img id="audioVolumeIcon" style="width: 29px;" />
                                    </div>
                                    <div class="flex-grow-1">
                                        <input type="range" class="form-range volume-range m-0" min="1" max="10" increment="1"
                                            id="volume">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <div class="badge p-0" id="hijriDateOffsetTitle"></div>
                            <div class="bg-darkish px-1 py-1 rounded">
                                <div class="d-flex flex-row align-items-end justify-content-between">
                                    <div class="col-7">
                                        <span class="todaysDateArabic badge"></span>
                                    </div>
                                    <div class="col-5">
                                        <div class="d-flex flex-row gap-1 justify-content-center">
                                            <div><button id="hijriDateDecrease"
                                                    class="btn btn-dark btn-xs pointerOn">-</button>
                                            </div>
                                            <div><span id="hijriDateOffset" class="badge bg-light text-dark">0</span>
                                            </div>
                                            <div><button id="hijriDateIncrease"
                                                    class="btn btn-dark btn-xs pointerOn">+</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-flex flex-row justify-content-between align-items-center gap-1">
                            <div>
                                <select class="form-control form-control-sm" id="displayLanguage">
                                </select>
                            </div>

                            <div class="flex-fill">
                                <button id="settingsCodeButton" title="SettingsCode"
                                    class="btn btn-sm btn-primary p-1 col-12">
                                    <span><img src="images/copy.png" class="img-fluid" /></span>
                                    <span id="settingsCodeTitle"></span>
                                </button>
                            </div>

                            <div class="col-2">
                                <button id="appResetButton" title="Reset"
                                    class="btn btn-danger col-12 p-1 text-light btn-sm">
                                    <img src="images/reset.png" class="img-fluid" />
                                </button>
                            </div>

                            <!-- Info tab icon - temporarily hidden, may bring back later
                            <div class="col-2">
                                <button id="infoIcon" title="About &amp; more from us"
                                    class="btn btn-secondary col-12 p-1 btn-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                                </button>
                            </div>
                            -->

                        </div>

                    </div>

                </div>

                <div id="alarmsSettings" class="tabDiv text-start h-100 pt-2 pb-2" style="display:none;">

                    <div class="d-flex flex-column h-100" style="overflow:hidden;">

                    <div class="flex-shrink-0">

                    <ul class="nav nav-pills nav-justified" id="alarms-tab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active btn-sm py-1" id="add-alarm-tab"
                                data-bs-toggle="pill" data-bs-target="#add-alarm-pane" type="button" role="tab">+
                                <span class="alarmTabText">Alarm</span></button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link btn-sm py-1" id="add-nafl-tab"
                                data-bs-toggle="pill" data-bs-target="#add-nafl-pane" type="button" role="tab">+
                                <span class="naflTabText">Nafl Alarm</span></button>
                        </li>
                    </ul>

                    <div class="tab-content py-2 px-2 mb-3" id="alarms-tabContent">

                        <div class="tab-pane fade show active" id="add-alarm-pane" role="tabpanel">
                            <select id="alarmSound" class="form-control form-control-sm mb-2"></select>
                            <select id="alarmFrequency" class="form-control form-control-sm mb-2">
                                <option value="W" class="weekdaysText">Weekdays</option>
                                <option value="E" class="everydayText">Everyday</option>
                            </select>
                            <div class="d-flex flex-row align-items-center gap-1">
                                <span class="small" style="padding-inline-end:5px;">at</span>
                                <select id="alarmHour" class="form-control form-control-sm p-1"></select>
                                <span class="small">:</span>
                                <select id="alarmMinute" class="form-control form-control-sm p-1"></select>
                                <select id="alarmAp" class="form-control form-control-sm p-1">
                                    <option value="am">am</option>
                                    <option value="pm">pm</option>
                                </select>
                                <button id="addAlarmButton" type="button"
                                    class="btn btn-sm btn-warning px-3 ms-auto">+</button>
                            </div>
                        </div>

                        <div class="tab-pane fade" id="add-nafl-pane" role="tabpanel">
                            <select id="naflSound" class="form-control form-control-sm mb-2"></select>
                            <select id="naflVakit" class="form-control form-control-sm mb-2"></select>
                            <div class="d-flex flex-row align-items-center gap-1">
                                <select id="naflMinutes" class="form-control form-control-sm p-1"></select>
                                <select id="naflWhen" class="form-control form-control-sm p-1">
                                    <option value="before" class="beforeText">before</option>
                                    <option value="after" class="afterText">after</option>
                                </select>
                                <button id="addNaflButton" type="button"
                                    class="btn btn-sm btn-success px-3 ms-auto">+</button>
                            </div>
                        </div>

                    </div>

                    </div>

                    <div id="alarmsList" class="flex-grow-1 csb pe-1" style="overflow-y:auto; min-height:0;"></div>

                    </div>

                </div>

                <div id="infoTab" class="tabDiv text-start h-100 pt-2" style="display:none;">
                    <div class="d-flex flex-column h-100 csb pe-1" style="overflow-y:auto; min-height:0;">
                        <div class="info-thanks">
                            <div class="info-thanks-title">Thank you! 🌙</div>
                            <div class="info-thanks-text">Thanks for using our Prayer Times extension. For any
                                questions or suggestions, contact us at <a href="mailto:info@azanclock.com"
                                    class="info-inline-link">info@azanclock.com</a>.</div>
                            <a href="https://chromewebstore.google.com/detail/prayer-times-chrome-exten/fbkmgnkliklgbmanjkmiihkdioepnkce/reviews"
                                target="_blank" rel="noopener" class="info-review-btn">Leave a review</a>
                        </div>
                        <div class="info-section-label">More from us</div>
                        <a href="https://azanclock.com" target="_blank" rel="noopener" class="info-link info-link-photo-card">
                            <img src="images/azan-clock.jpg" alt="AzanClock device" class="info-link-photo" />
                        </a>
                        <a href="https://zakattracker.com" target="_blank" rel="noopener" class="info-link info-link-row">
                            <img src="images/zakattracker-logo.png" alt="ZakatTracker" class="info-link-logo-sm" />
                            <div class="info-link-title">Calculate and track your zakat easily</div>
                        </a>
                    </div>
                </div>

                <div id="quranTab" class="tabDiv h-100" style="display:none;">
                    <div class="quran-player d-flex flex-column h-100">
                        <div class="quran-controls d-flex flex-column flex-grow-1 justify-content-center">

                            <div class="quran-display">
                                <button id="quranDispPrevBtn" type="button" class="quran-disp-nav quran-disp-prev" aria-label="Previous surah" title="Previous surah"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="quranArrowGoldL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdeeb8"/><stop offset="0.55" stop-color="#e7cf86"/><stop offset="1" stop-color="#d4af37"/></linearGradient></defs><path d="M16 3 6.9 11.3Q6.2 12 6.9 12.7L16 21 11.6 12Z" fill="url(#quranArrowGoldL)"/></svg></button>
                                <button id="quranDispNextBtn" type="button" class="quran-disp-nav quran-disp-next" aria-label="Next surah" title="Next surah"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="quranArrowGoldR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdeeb8"/><stop offset="0.55" stop-color="#e7cf86"/><stop offset="1" stop-color="#d4af37"/></linearGradient></defs><path d="M8 3 17.1 11.3Q17.8 12 17.1 12.7L8 21 12.4 12Z" fill="url(#quranArrowGoldR)"/></svg></button>
                                <div id="quranSurahCaption" class="quran-surah-caption">
                                    <span id="quranSurahNumber" class="quran-surah-number"></span>
                                </div>
                                <div id="quranSurahArabic" class="quran-surah-arabic"></div>
                                <div class="quran-surah-name-row">
                                    <button id="quranSurahBtn" type="button" class="quran-name-link"
                                        aria-label="Change surah">
                                        <span id="quranSurahName" class="quran-surah-name"></span>
                                    </button>
                                    <span id="quranSajdaBadge" class="quran-sajda-badge" style="display:none;"
                                        aria-hidden="true"><span class="quran-sajda-mark">۩</span></span>
                                </div>
                                <div class="quran-check-row">
                                    <span class="quran-check-center">
                                        <span id="quranSurahCheck" class="quran-name-check" role="button"
                                            aria-label="Toggle completed"><svg xmlns="http://www.w3.org/2000/svg"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                                                stroke-linecap="round" stroke-linejoin="round"><path
                                                    d="M20 6 9 17l-5-5" /></svg></span>
                                    </span>
                                </div>
                                <div class="quran-links-row d-flex flex-row align-items-center justify-content-center">
                                    <button id="quranReciterBtn" type="button" class="quran-reciter-btn" aria-label="Reciter"
                                        title="Reciter">
                                        <svg class="quran-mic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" /><path
                                                d="M5 10a7 7 0 0 0 14 0" /><line x1="12" y1="19" x2="12" y2="22" /></svg>
                                        <span id="quranReciterName" class="quran-reciter-name">—</span>
                                    </button>
                                    <a id="quranComLink" class="quran-reciter-btn quran-com-link" target="_blank"
                                        rel="noopener" aria-label="Open this surah on quran.com" title="Open on quran.com"
                                        href="https://quran.com/1">
                                        <svg class="quran-mic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" /><path
                                                d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" /></svg>
                                        <span id="quranComLinkText" class="quran-reciter-name">quran.com</span>
                                    </a>
                                </div>
                            </div>

                            <div class="quran-playback d-flex flex-column">
                                <div class="quran-progress-row">
                                    <div class="quran-time d-flex flex-row justify-content-between">
                                        <span id="quranTimeCur">0:00</span>
                                        <span id="quranTimeDur">0:00</span>
                                    </div>
                                    <input type="range" id="quranProgress" class="quran-progress" min="0" max="1000"
                                        value="0" step="1" aria-label="Seek" />
                                </div>

                                <div class="quran-transport d-flex flex-row align-items-center">
                                    <button id="quranBack10Btn" type="button" class="quran-skip" aria-label="Back 10 seconds"><svg
                                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                                            stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                                            stroke-linejoin="round"><path
                                                d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" /><path
                                                d="M3 3v5h5" /><text x="12" y="15.5" font-size="7" font-weight="700"
                                                stroke="none" fill="currentColor" text-anchor="middle"
                                                font-family="sans-serif">10</text></svg></button>
                                    <button id="quranPrevBtn" type="button" class="quran-nav-btn" aria-label="Previous"><svg
                                            xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path
                                                d="M7 6h2v12H7z" /><path d="M20 6v12l-9-6z" /></svg></button>
                                    <button id="quranToggleBtn" type="button" class="quran-toggle" aria-label="Listen"><svg
